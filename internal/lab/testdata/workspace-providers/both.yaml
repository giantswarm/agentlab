            clientID: Iv1.agentlab-workspaces
            clientSecret:
                key: client-secret
                name: workspace-fake
        url: https://github.127.0.0.1.nip.io
    - kind: github
      name: github
      values:
        app:
            id: "123456"
            privateKey:
                key: private-key
                name: workspace-github
        oauth:
            clientID: Iv23liWorkspaceLab
            clientSecret:
                key: client-secret
                name: workspace-github
