grant:
    signingKey:
        key: grant
        name: workspace-manager-grant
muster:
    mcpServer:
        auth:
            requiredAudiences:
                - kubernetes
oauth:
    baseURL: https://workspace-manager.127.0.0.1.nip.io:8443
providers:
    - kind: github
      name: github
      values:
        app:
            id: "123456"
            privateKey:
                key: private-key
                name: workspace-github
        oauth:
            clientID: Iv23liWorkspaceLab
            clientSecret:
                key: client-secret
                name: workspace-github
    - kind: gitlab
      name: gitlab
      values:
        oauth:
            clientID: Iv23liWorkspaceLab
            clientSecret:
                key: client-secret
                name: workspace-gitlab
        token:
            key: token
            name: workspace-gitlab
        url: https://gitlab.example.com
tokenExchange:
    clientID: kagent
    clientSecret:
        key: client-secret
        name: workspace-manager-token-exchange
