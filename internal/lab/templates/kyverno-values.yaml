# The lab's Kyverno: the admission controller alone, in the shape a kind
# cluster can carry, from the upstream kyverno chart (3.7.2, appVersion
# v1.17.2 — the very subchart the fleet's giantswarm/kyverno 0.24.2 wraps;
# admission.go pins the chart, this file its values). One replica, no
# background, cleanup or reports controllers, no reports of any kind, no
# policy exceptions, no metrics scraping, no CRD-migration hook: what a
# validate-only policy on a one-node cluster needs and nothing it does not.
# The images are the fleet's builds of the same version on gsoci, so the
# node pulls what an installation runs. The fleet's wrapper chart is not
# used on purpose: it renders policy-reporter (three Deployments), a
# ServiceMonitor and VerticalPodAutoscalers unconditionally — objects for
# an installation, not a kind cluster.
admissionController:
  replicas: 1
  podDisruptionBudget:
    enabled: false
  container:
    image:
      registry: gsoci.azurecr.io
      repository: giantswarm/kyverno
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 384Mi
  initContainer:
    image:
      registry: gsoci.azurecr.io
      repository: giantswarm/kyvernopre
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
backgroundController:
  enabled: false
cleanupController:
  enabled: false
reportsController:
  enabled: false
features:
  admissionReports:
    enabled: false
  aggregateReports:
    enabled: false
  policyReports:
    enabled: false
  validatingAdmissionPolicyReports:
    enabled: false
  backgroundScan:
    enabled: false
  generateValidatingAdmissionPolicy:
    enabled: false
  policyExceptions:
    enabled: false
crds:
  migration:
    enabled: false
webhooksCleanup:
  enabled: false
policyReportsCleanup:
  enabled: false
grafana:
  enabled: false
