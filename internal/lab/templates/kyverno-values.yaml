# The lab's Kyverno: the fleet's kyverno app (gsoci.azurecr.io/charts/
# giantswarm/kyverno 0.24.2, the chart security-bundle installs on every
# installation; it wraps the upstream kyverno chart 3.7.2, appVersion
# v1.17.2, and policy-reporter) in the shape a kind cluster can carry.
# admission.go pins the chart and the kyverno-crds chart beside it, this
# file the values. The app's defaults are an installation's: its images on
# gsoci, so the node pulls what an installation runs. The admission and
# reports controllers run as on an installation, admission reports, policy
# reports and the background scan on, so `kubectl get policyreports -A`
# lists the fleet's policies' results (reports.go). Turned off here what a
# one-node lab has no API or use for: the CiliumNetworkPolicy, the
# VerticalPodAutoscalers, the PodLogs, the app's PolicyExceptions and
# policies for the fleet's own components, the HPA, the ServiceMonitors,
# API priority and fairness, the PodDisruptionBudgets, the installation's
# PriorityClass giantswarm-critical, and the background and cleanup
# controllers (generate, mutate-existing and cleanup policies the lab does
# not run).
# PolicyExceptions stay as the app ships them, on for every namespace
# (features.policyExceptions), the fleet's setting: the exception webhook
# validates a chart's exceptions either way, and with it on the engine
# applies an exception the way an installation's does (polextest.go).
# policy-reporter is a dependency without a condition: its one Deployment
# stays, its UI, plugins and monitoring off.
ciliumNetworkPolicy:
  enabled: false
verticalPodAutoscaler:
  admissionController:
    enabled: false
  backgroundController:
    enabled: false
  cleanupController:
    enabled: false
  reportsController:
    enabled: false
  kyvernoPlugin:
    enabled: false
  policyReporter:
    enabled: false
  ui:
    enabled: false
monitoring:
  podLogs:
    enabled: false
policyExceptions:
  enablePolexPolicy: false
  enableChartOperatorPolex: false
  enableCiliumPolex: false
  enableWildcardMatchPolicy: false
  enableNoisyContextsPolicy: false
  enableAwsCloudControllerManagerPolex: false
  enableAwsEbsCsiDriverPolex: false
  enableAzureCloudControllerManagerPolex: false
  enableAzureCloudNodeManagerPolex: false
kyverno:
  admissionController:
    replicas: 1
    priorityClassName: ""
    autoscaling:
      enabled: false
    apiPriorityAndFairness: false
    serviceMonitor:
      enabled: false
    podDisruptionBudget:
      enabled: false
    container:
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 384Mi
    initContainer:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi
  backgroundController:
    enabled: false
  cleanupController:
    enabled: false
  reportsController:
    enabled: true
    replicas: 1
    priorityClassName: ""
    apiPriorityAndFairness: false
    antiAffinity:
      enabled: false
    serviceMonitor:
      enabled: false
    podDisruptionBudget:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
  features:
    admissionReports:
      enabled: true
    aggregateReports:
      enabled: true
    policyReports:
      enabled: true
    validatingAdmissionPolicyReports:
      enabled: true
    backgroundScan:
      enabled: true
    generateValidatingAdmissionPolicy:
      enabled: false
  crds:
    migration:
      enabled: false
  webhooksCleanup:
    enabled: false
  policyReportsCleanup:
    enabled: false
  grafana:
    enabled: false
policy-reporter:
  ui:
    enabled: false
  plugin:
    kyverno:
      enabled: false
    trivy:
      enabled: false
  monitoring:
    enabled: false
