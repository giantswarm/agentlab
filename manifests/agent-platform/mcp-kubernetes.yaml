# The Kubernetes MCP server itself. Not part of the agent-platform
# meta-package (that only renders the MCPServer CR that points AT it), so it is
# its own Flux release.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: mcp-kubernetes
  namespace: agent-platform
spec:
  interval: 5m
  url: oci://gsoci.azurecr.io/charts/giantswarm/mcp-kubernetes
  ref:
    semver: "1.0.9"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mcp-kubernetes
  namespace: agent-platform
spec:
  interval: 5m
  releaseName: mcp-kubernetes
  targetNamespace: agent-platform
  chartRef:
    kind: OCIRepository
    name: mcp-kubernetes
    namespace: agent-platform
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    # No Cilium in kind.
    ciliumNetworkPolicy:
      enabled: false
    # Service Account Mode: mcp-kubernetes itself is unauthenticated on the
    # cluster network and talks to the apiserver as its own ServiceAccount.
    # muster is the only thing that can reach it, and muster is the component
    # that enforces Dex login. Matches `auth.mode: none` on the MCPServer CR.
    mcpKubernetes:
      oauth:
        enabled: false
      kubernetes:
        enableDownstreamOAuth: false
    rbac:
      create: true
      # Chart default. Grants writes and cluster-wide secret reads — acceptable
      # for a throwaway lab; drop to "readonly" for a read-only demo.
      profile: standard
