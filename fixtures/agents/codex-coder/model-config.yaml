# The codex coder's model beside the codex Harness (platform.coding with codex
# among platform.coding.harnesses): a ModelConfig on a ChatGPT subscription
# login (docs/chatgpt-login.md in giantswarm/agent-platform), declared next to
# the agents. The login Secret kagent-chatgpt-login is the installation's own,
# never in this file.
apiVersion: api.kagent.dev/v1alpha3
kind: ModelConfig
metadata:
  name: openai-chatgpt-codex
  namespace: kagent
  annotations:
    ui.giantswarm.io/display-name: GPT-5.6 Luna (ChatGPT)
spec:
  provider: OpenAI
  model: gpt-5.6-luna
  apiKeySecret: kagent-chatgpt-login
  openAI:
    credentialType: chatgptOAuth
    apiFormat: responses
