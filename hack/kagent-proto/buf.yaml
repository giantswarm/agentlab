# The kagent API v2 service protos the lab generates its client stubs from.
# The files under kagent/ and ateapi.proto (Agent Substrate's API, which
# system.proto imports) are verbatim copies from giantswarm/kagent-upstream
# at KAGENT_PROTO_COMMIT in ../../Makefile.custom.mk;
# `make generate-kagent` refreshes both.
version: v2
modules:
  - path: .
deps:
  - buf.build/bufbuild/protovalidate
lint:
  use:
    - STANDARD
  ignore:
    - ateapi.proto
breaking:
  use:
    - FILE
